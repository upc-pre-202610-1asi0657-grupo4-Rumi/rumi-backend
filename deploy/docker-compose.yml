# Rumi completo en local con infraestructura real.
# Requiere los 9 repositorios clonados lado a lado (ver clone-all.sh).
# Uso, desde rumi-backend/deploy: docker compose up --build
# Solo el gateway (8080) se publica en la red; la infraestructura, solo en 127.0.0.1.
# Puertos de los servicios para depurar: -f docker-compose.yml -f docker-compose.debug.yml
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rumi
      POSTGRES_PASSWORD: rumi
      POSTGRES_DB: buildingsdb
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../rumi-building-service/docs/schema.sql:/docker-entrypoint-initdb.d/01-building-schema.sql:ro
      - ./postgres/init/02-create-seismic-database.sql:/docker-entrypoint-initdb.d/02-create-seismic-database.sql:ro
      - ./postgres/init/03-create-notifications-database.sql:/docker-entrypoint-initdb.d/03-create-notifications-database.sql:ro
      - ../../rumi-notification-service/docs/schema.sql:/opt/rumi/notification-schema.sql:ro
      - ../../rumi-iam-service/docs/schema.sql:/opt/rumi/iam-schema.sql:ro
      - ./postgres/init/04-create-iam-database.sql:/docker-entrypoint-initdb.d/04-create-iam-database.sql:ro
      - ../../rumi-billing-service/docs/schema.sql:/opt/rumi/billing-schema.sql:ro
      - ./postgres/init/05-create-billing-database.sql:/docker-entrypoint-initdb.d/05-create-billing-database.sql:ro
      # Long syntax: if a source file is missing, Compose fails instead of creating an empty directory.
      - type: bind
        source: ../../rumi-safety-service/docs/schema.sql
        target: /opt/rumi/safety-schema.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./postgres/init/06-create-evacuation-database.sql
        target: /docker-entrypoint-initdb.d/06-create-evacuation-database.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../rumi-maintenance-service/docs/schema.sql
        target: /opt/rumi/maintenance-schema.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./postgres/init/07-create-maintenance-database.sql
        target: /docker-entrypoint-initdb.d/07-create-maintenance-database.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # TCP, not the socket: while the init scripts run, PostgreSQL only listens on the socket, so the
      # services wait until every database and schema has been created.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rumi -d buildingsdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rumi-net

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: rumi
      POSTGRES_PASSWORD: rumi
      POSTGRES_DB: sensorreadingsdb
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./timescaledb/init/01-enable-timescaledb.sql:/docker-entrypoint-initdb.d/01-enable-timescaledb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rumi -d sensorreadingsdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rumi-net

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: rumi
      RABBITMQ_DEFAULT_PASS: rumi
    # Only on this machine: the notification tests still use the local broker (127.0.0.1:5672).
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rumi-net

  rumi-api-gateway:
    build: { context: ../../rumi-api-gateway, args: { PORT: 8080 } }
    # The only port published to the network: every request goes through the gateway.
    ports: ["8080:8080"]
    environment:
      SERVER_PORT: 8080
      BUILDING_SERVICE_URL: http://rumi-building-service:8081
      MONITORING_SERVICE_URL: http://rumi-monitoring-service:8082
      SEISMIC_SERVICE_URL: http://rumi-seismic-service:8083
      IAM_SERVICE_URL: http://rumi-iam-service:8084
      NOTIFICATION_SERVICE_URL: http://rumi-notification-service:8085
      SAFETY_SERVICE_URL: http://rumi-safety-service:8086
      BILLING_SERVICE_URL: http://rumi-billing-service:8087
      MAINTENANCE_SERVICE_URL: http://rumi-maintenance-service:8088
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 characters) before running docker compose}
    depends_on:
      - rumi-building-service
      - rumi-monitoring-service
      - rumi-seismic-service
      - rumi-iam-service
      - rumi-notification-service
      - rumi-safety-service
      - rumi-billing-service
      - rumi-maintenance-service
    networks:
      - rumi-net

  rumi-building-service:
    build: { context: ../../rumi-building-service, args: { PORT: 8081 } }
    expose: ["8081"]
    environment:
      SERVER_PORT: 8081
      BUILDING_DB_URL: jdbc:postgresql://postgres:5432/buildingsdb
      BUILDING_DB_USERNAME: rumi
      BUILDING_DB_PASSWORD: rumi
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: rumi
      RABBITMQ_PASSWORD: rumi
      MESSAGING_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rumi-net

  rumi-monitoring-service:
    build: { context: ../../rumi-monitoring-service, args: { PORT: 8082 } }
    expose: ["8082"]
    environment:
      SERVER_PORT: 8082
      MONITORING_DB_URL: jdbc:postgresql://timescaledb:5432/sensorreadingsdb
      MONITORING_DB_USERNAME: rumi
      MONITORING_DB_PASSWORD: rumi
      RUMI_TIMESCALE_HYPERTABLE_INITIALIZATION: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: rumi
      RABBITMQ_PASSWORD: rumi
      MESSAGING_ENABLED: "true"
    depends_on:
      timescaledb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rumi-net

  rumi-seismic-service:
    build: { context: ../../rumi-seismic-service, args: { PORT: 8083 } }
    expose: ["8083"]
    environment:
      SERVER_PORT: 8083
      SEISMIC_DB_URL: jdbc:postgresql://postgres:5432/seismiceventsdb
      SEISMIC_DB_USERNAME: rumi
      SEISMIC_DB_PASSWORD: rumi
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: rumi
      RABBITMQ_PASSWORD: rumi
      MESSAGING_ENABLED: "true"
      IGP_LATEST_EVENT_URL: ${IGP_LATEST_EVENT_URL:-http://localhost:8099/igp/latest-event}
      RISK_STRATEGY: ${RISK_STRATEGY:-rule-based}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rumi-net

  rumi-iam-service:
    build: { context: ../../rumi-iam-service, args: { PORT: 8084 } }
    expose: ["8084"]
    environment:
      SERVER_PORT: 8084
      IAM_DB_URL: jdbc:postgresql://postgres:5432/iamdb
      IAM_DB_USERNAME: rumi
      IAM_DB_PASSWORD: rumi
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 characters) before running docker compose}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: rumi
      RABBITMQ_PASSWORD: rumi
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rumi-net

  rumi-notification-service:
    build: { context: ../../rumi-notification-service, args: { PORT: 8085 } }
    expose: ["8085"]
    environment:
      SERVER_PORT: 8085
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notificationsdb
      NOTIFICATION_DB_USERNAME: rumi
      NOTIFICATION_DB_PASSWORD: rumi
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: rumi
      RABBITMQ_PASSWORD: rumi
      MESSAGING_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rumi-net

  rumi-safety-service:
    build: { context: ../../rumi-safety-service, args: { PORT: 8086 } }
    expose: ["8086"]
    environment:
      SERVER_PORT: 8086
      SAFETY_DB_URL: jdbc:postgresql://postgres:5432/evacuationdb
      SAFETY_DB_USERNAME: rumi
      SAFETY_DB_PASSWORD: rumi
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rumi-net

  rumi-billing-service:
    build: { context: ../../rumi-billing-service, args: { PORT: 8087 } }
    expose: ["8087"]
    environment:
      SERVER_PORT: 8087
      BILLING_DB_URL: jdbc:postgresql://postgres:5432/billingdb
      BILLING_DB_USERNAME: rumi
      BILLING_DB_PASSWORD: rumi
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rumi-net
      
  rumi-maintenance-service:
    build: { context: ../../rumi-maintenance-service, args: { PORT: 8088 } }
    expose: ["8088"]
    environment:
      SERVER_PORT: 8088
      MAINTENANCE_DB_URL: jdbc:postgresql://postgres:5432/maintenancedb
      MAINTENANCE_DB_USERNAME: rumi
      MAINTENANCE_DB_PASSWORD: rumi
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rumi-net

volumes:
  postgres_data:
  timescaledb_data:
  rabbitmq_data:

networks:
  rumi-net:
    driver: bridge